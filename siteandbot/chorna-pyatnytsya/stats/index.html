<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Статистика лендингу · Метаморфоза</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<style>
:root{--g:#133512;--g2:#1E4A1C;--gs:#E3EBE0;--gold:#C9A034;--gold-l:#E8C766;--bg:#FBF8F5;--sand:#EFE8E2;--clay:#D9C5BA;--dark:#2C2018;--mid:#6B5A50;--light:#9A8880;--err:#A86464;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:Georgia,'Times New Roman',serif}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:var(--sans);background:var(--bg);color:var(--dark);font-size:15px;line-height:1.5}
.top{background:var(--g);color:#F3EEDF;padding:14px 0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-family:var(--serif);font-weight:400;font-size:20px}
.top small{color:#C9D2C4}
.month{display:flex;align-items:center;gap:8px}
.month button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.month span{min-width:130px;text-align:center;font-weight:500}
main.wrap{padding-top:22px;padding-bottom:50px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--sand);border-radius:14px;padding:16px}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;color:var(--g);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mid)}
.kpi.hot{background:var(--g);border-color:var(--g)}
.kpi.hot b{color:var(--gold-l)}.kpi.hot span{color:#C9D2C4}
.card{background:#fff;border:1px solid var(--sand);border-radius:14px;padding:18px}
.card h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:12px}
.card p.note{font-size:13px;color:var(--mid);margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1px solid var(--clay);padding-top:18px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:default}
.col i{display:block;background:var(--g);border-radius:4px 4px 0 0;min-height:0}
.col em{position:absolute;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--gold)}
.col:hover i{background:var(--g2)}
.chart-x{display:flex;gap:3px;margin-top:4px}
.chart-x span{flex:1;text-align:center;font-size:11px;color:var(--light)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mid);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--g);margin-right:5px;vertical-align:-1px}
.legend i.l{border-radius:50%;background:var(--gold)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.bar span{font-size:14px}
.bar span small{display:block;font-size:12px;color:var(--light);line-height:1.3}
.bar b{font-variant-numeric:tabular-nums;font-weight:600}
.bar .m{grid-column:1/-1;height:6px;border-radius:6px;background:var(--sand);overflow:hidden}
.bar .m i{display:block;height:100%;background:var(--g);border-radius:6px}
.bar.lead .m i{background:var(--gold)}
.empty{color:var(--light);font-size:14px}
.tip{position:fixed;background:var(--dark);color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none;z-index:9;white-space:nowrap}
.login{max-width:360px;margin:12vh auto 0;background:#fff;border:1px solid var(--sand);border-radius:16px;padding:26px;display:grid;gap:12px}
.login h1{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--g)}
.login p{color:var(--mid);font-size:14px}
input{font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--clay);border-radius:10px;width:100%}
input:focus{outline:none;border-color:var(--g)}
.btn{background:var(--g);color:#fff;border:none;border-radius:100px;padding:13px 20px;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--err);font-size:14px}
.out{background:none;border:1px solid rgba(255,255,255,.3);color:#C9D2C4;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.kpi.hot{grid-column:1/-1}.grid2{grid-template-columns:1fr}.kpi b{font-size:26px}}
</style>
</head>
<body>

<form class="login" id="login">
  <h1>Статистика лендингу</h1>
  <p>«Чорна пʼятниця» · Метаморфоза. Пароль — той самий, що для входу адміністратора в /admin основного сайту.</p>
  <input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required>
  <div class="err" id="loginErr" hidden></div>
  <button class="btn" type="submit">Увійти</button>
</form>

<div id="app" hidden>
  <div class="top"><div class="wrap">
    <div><b>Статистика лендингу</b><br><small>Чорна пʼятниця · Метаморфоза</small></div>
    <div class="month"><button type="button" id="prev" aria-label="Попередній місяць">‹</button><span id="mLabel"></span><button type="button" id="next" aria-label="Наступний місяць">›</button></div>
    <button class="out" type="button" id="logout">Вийти</button>
  </div></div>
  <main class="wrap" id="body"></main>
</div>

<script>
// Статистика зберігається на основному сайті (окремо від його власної статистики)
const MAIN_SITE = "https://psy-centr-kyiv-morphosis.netlify.app";
const API = MAIN_SITE + "/.netlify/functions/api?a=bf-stats";
const MONTHS = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
const NAMES = {
  booking_click: "Кнопка «Забронювати»", choose_specialist: "Обрали фахівця (у формі)", specialist_open: "Відкрили картку фахівця",
  promo_click: "Натиснули на пропозицію", form_submit_psy: "✅ Залишили заявку", telegram_click: "Telegram", instagram_click: "Instagram",
  rent_click: "Посилання «Оренда»", bf_form_start: "Почали заповнювати форму", bf_messenger: "Кнопка месенджера", bf_topic: "Обрали запит",
};
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
let pw = ""; try { pw = sessionStorage.getItem("bf_pw") || ""; } catch {}
const now = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Kyiv" }).format(new Date());
let month = now.slice(0, 7);

async function load() {
  const r = await fetch(`${API}&month=${month}`, { headers: { Authorization: "Bearer " + pw } });
  const j = await r.json().catch(() => ({ ok: false, error: "Сервер не відповідає" }));
  if (!j.ok) throw Object.assign(new Error(j.error || "Помилка"), { status: r.status });
  return j;
}
async function show() {
  try {
    const d = await load();
    $("#login").hidden = true; $("#app").hidden = false;
    render(d);
  } catch (e) {
    $("#app").hidden = true; $("#login").hidden = false;
    if (pw) { $("#loginErr").textContent = e.message; $("#loginErr").hidden = false; }
  }
}
$("#login").addEventListener("submit", (e) => { e.preventDefault(); pw = $("#pw").value; try { sessionStorage.setItem("bf_pw", pw); } catch {} show(); });
$("#logout").addEventListener("click", () => { pw = ""; try { sessionStorage.removeItem("bf_pw"); } catch {} location.reload(); });
const shift = (n) => { const [y, m] = month.split("-").map(Number); const dt = new Date(y, m - 1 + n, 1); month = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; show(); };
$("#prev").onclick = () => shift(-1); $("#next").onclick = () => shift(1);

const total = (obj) => Object.values(obj || {}).reduce((t, x) => t + x, 0);
const dur = (s) => { s = Math.round(s); return s < 60 ? `${s} с` : `${Math.floor(s / 60)} хв ${pad(s % 60)} с`; };
function bars(rows, base, cls = "") {
  if (!rows.length) return `<p class="empty">Ще немає даних</p>`;
  const max = base || Math.max(...rows.map((r) => r[1]), 1);
  return `<div class="bars">${rows.map(([k, c, sub, extra]) => `<div class="bar ${extra || cls}"><span>${k}${sub ? `<small>${sub}</small>` : ""}</span><b>${c}</b><div class="m"><i style="width:${Math.round((c / Math.max(1, max)) * 100)}%"></i></div></div>`).join("")}</div>`;
}
const sorted = (obj) => Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).map(([k, c]) => [esc(k), c]);

function render(d) {
  const [y, m] = month.split("-").map(Number), n = new Date(y, m, 0).getDate();
  $("#mLabel").textContent = `${MONTHS[m - 1]} ${y}`;
  const days = Array.from({ length: n }, (_, i) => ({ day: i + 1, views: 0, visitors: 0, seconds: 0, leads: 0, ...(d.days[`${month}-${pad(i + 1)}`] || {}) }));
  const sum = (f) => days.reduce((t, x) => t + x[f], 0);
  const visitors = sum("visitors"), views = sum("views"), leads = total(d.events.form_submit_psy);
  const ev = (e) => total(d.events[e]);
  const sc = d.events.bf_scroll || {}, opened = ev("bf_view") || views;
  const msg = d.events.bf_messenger || {}, wrote = (msg.Telegram || 0) + (msg.Instagram || 0);
  const maxV = Math.max(1, ...days.map((x) => x.visitors));
  const funnel = [["Відкрили сторінку", opened], ["Прокрутили до половини", sc["50%"] || 0], ["Дочитали до кінця", sc["100%"] || 0],
    ["Почали заповнювати форму", ev("bf_form_start")], ["✅ Залишили заявку", leads, "", "lead"], ["💬 Написали в месенджер", wrote, "", "lead"]]
    .map(([k, c, s, cls]) => [k, c, `${opened ? Math.round((c / opened) * 100) : 0}% від тих, хто відкрив`, cls]);
  const clicks = Object.keys(NAMES).filter((e) => ev(e)).sort((a, b) => ev(b) - ev(a)).map((e) => {
    const top = Object.entries(d.events[e]).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([l, c]) => `${esc(l.replace(/^BF:\s*/, ""))} — ${c}`).join(" · ");
    return [NAMES[e], ev(e), top, e === "form_submit_psy" ? "lead" : ""];
  });
  const TB = ["до 10 с", "10–30 с", "30 с – 1 хв", "1–3 хв", "3–10 хв", "понад 10 хв"];
  const strip = (obj) => Object.fromEntries(Object.entries(obj || {}).map(([k, v]) => [k.replace(/^BF:\s*/, ""), v]));

  $("#body").innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${visitors}</b><span>відвідувачів</span></div>
      <div class="kpi"><b>${views}</b><span>переглядів</span></div>
      <div class="kpi"><b>${views ? dur(sum("seconds") / views) : "—"}</b><span>середній час на сторінці</span></div>
      <div class="kpi"><b>${leads}</b><span>заявок</span></div>
      <div class="kpi hot"><b>${visitors ? ((leads / visitors) * 100).toFixed(1) : "0"}%</b><span>конверсія у заявку</span></div>
    </div>
    <div class="card"><h3>Відвідувачі і заявки по днях</h3>
      <div class="chart" id="chart">${days.map((x) => `<div class="col" data-tip="${x.day}.${pad(m)}: ${x.visitors} відвідувачів · ${x.views} переглядів · ${x.leads} заявок"><i style="height:${(x.visitors / maxV) * 100}%"></i>${x.leads ? `<em style="bottom:calc(${(x.visitors / maxV) * 100}% + 4px)"></em>` : ""}</div>`).join("")}</div>
      <div class="chart-x">${days.map((x) => `<span>${x.day === 1 || x.day % 5 === 0 ? x.day : ""}</span>`).join("")}</div>
      <div class="legend"><span><i></i>відвідувачі</span><span><i class="l"></i>був день із заявкою</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Воронка</h3>${bars(funnel, opened)}</div>
      <div class="card"><h3>Звідки приходять</h3>${bars(sorted(d.sources))}
        <h3 style="margin-top:18px">З якої реклами (utm_content / utm_campaign)</h3>${bars(sorted(d.events.bf_ad))}
        <p class="note">Додавайте до посилання в рекламі, напр. <code>?utm_source=ig&amp;utm_content=reel1</code></p></div>
    </div>
    <div class="card"><h3>Які кнопки натискають</h3>${bars(clicks)}</div>
    <div class="grid2">
      <div class="card"><h3>Скільки часу на сторінці</h3>${(() => { const tb = d.timeBuckets || {}; return total(tb) ? bars(TB.map((k) => [k, tb[k] || 0]), total(tb)) : `<p class="empty">Ще немає даних</p>`; })()}</div>
      <div class="card"><h3>Як далеко прокручують</h3>${bars(["25%", "50%", "75%", "100%"].filter((k) => sc[k]).map((k) => [`До ${k} сторінки`, sc[k]]), opened)}</div>
    </div>
    <div class="grid2">
      <div class="card"><h3>З якими запитами приходять</h3>${bars(sorted(d.events.bf_topic))}</div>
      <div class="card"><h3>Які фахівці цікавлять</h3>${bars(sorted(strip(d.events.specialist_open)))}</div>
    </div>
    <p class="note" style="color:var(--light);font-size:12px">Статистика анонімна: без cookies, IP-адрес та імен. Відвідувач рахується один раз на день.</p>`;

  let tip = document.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; document.body.appendChild(tip); }
  const ch = $("#chart");
  ch.addEventListener("mousemove", (e) => { const c = e.target.closest("[data-tip]"); if (!c) { tip.hidden = true; return; } tip.textContent = c.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY - 34 + "px"; });
  ch.addEventListener("mouseleave", () => (tip.hidden = true));
}
show();
</script>
</body>
</html>
