# Окремий сайт «Метаморфози» на Netlify.
# У Netlify: Base directory = siteandbot/metamorfoza (решта підтягнеться з цього файлу).
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
